# Example: /etc/logrotate.d/nginx-nanofold
# Preferred integration -- logrotate already knows the file is done being
# written, so the daemon's hook mode just compresses it, no guessing needed.

/var/log/nginx/access.log {
    daily
    rotate 7
    missingok
    notifempty
    postrotate
        NANOFOLD_KEY1_B64="$(cat /run/secrets/nanofold_key1_b64)" \
            /usr/bin/python3 /opt/nanofold/nanofold_daemon.py hook \
            /var/log/nginx/access.log.1 /var/log/nginx/nf_archive \
            --schema /opt/nanofold/schema.json
    endscript
}

# Note: /run/secrets/nanofold_key1_b64 is expected to live on a tmpfs
# (memory-backed) mount, e.g. injected by systemd's LoadCredential= or a
# secrets manager's runtime mount -- not a regular on-disk file. Key 1 is
# public, so this is about hygiene, not confidentiality: the point is to
# avoid an easily-forgotten key file sitting on persistent disk.

---

# Example: /etc/systemd/system/nanofold-watch.service
# Fallback continuous watcher, for directories logrotate doesn't manage.

[Unit]
Description=NanoFold directory watcher (fallback for non-logrotate-managed logs)
After=network.target

[Service]
Type=simple
User=nanofold
Group=nanofold
# LoadCredential mounts the secret on a memory-backed path at runtime;
# it never lives on persistent disk and isn't visible to other services.
LoadCredential=key1_b64:/etc/nanofold/key1_b64.secret
ExecStart=/bin/sh -c 'NANOFOLD_KEY1_B64="$(cat ${CREDENTIALS_DIRECTORY}/key1_b64)" \
    /usr/bin/python3 /opt/nanofold/nanofold_daemon.py watch \
    /var/log/some-app /var/log/some-app/nf_archive \
    --schema /opt/nanofold/schema.json --interval 5'
Restart=on-failure
RestartSec=5
# Principle of least privilege: this service only ever needs read+delete on
# the watched directory and write on the output directory -- scope its user
# accordingly, and it should never hold Key 2 at all.
NoNewPrivileges=true
ProtectSystem=strict
ReadWritePaths=/var/log/some-app /var/log/some-app/nf_archive

[Install]
WantedBy=multi-user.target
